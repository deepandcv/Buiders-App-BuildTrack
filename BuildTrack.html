<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildLedger India</title>
<style>
:root {
  --ink:#172b2b;
  --muted:#718080;
  --green:#187c68;
  --green-dark:#116552;
  --green-light:#e8f4f0;
  --line:#e4ece9;
  --paper:#ffffff;
  --bg:#f3f7f5;
  --nav:#102c2b;
  --amber:#b87012;
  --red:#b44343;
  --shadow:0 8px 28px rgba(20,50,45,.06);
}
* { box-sizing:border-box; }
body {
  margin:0;
  color:var(--ink);
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background:var(--bg);
}
button, input, select, textarea { font:inherit; }
button { cursor:pointer; }
.app-shell {
  min-height:100vh;
  display:grid;
  grid-template-columns:248px minmax(0,1fr);
}
.sidebar {
  background:var(--nav);
  color:#eaf4f1;
  padding:24px 16px;
  display:flex;
  flex-direction:column;
  gap:26px;
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 10px;
}
.brand-mark {
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  color:#fff;background:#248a72;font-weight:900;font-size:19px;
}
.brand-title { font-weight:800;letter-spacing:-.3px;font-size:16px; }
.brand-subtitle { color:#a8c4bd;font-size:11px;margin-top:2px; }
.nav-label {
  padding:0 11px;
  margin:0 0 8px;
  color:#8ca9a2;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.2px;
}
.nav-list { display:flex;flex-direction:column;gap:4px; }
.nav-link {
  border:0;background:transparent;color:#c9dad5;
  text-align:left;width:100%;padding:10px 11px;border-radius:9px;
  display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;
}
.nav-link:hover { background:rgba(255,255,255,.08);color:white; }
.nav-link.active { background:#1b6458;color:#fff; }
.nav-icon { width:18px;text-align:center;font-size:15px;opacity:.95; }
.sidebar-foot {
  margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);
  color:#a8c4bd;font-size:11px;line-height:1.55;
}
.main-wrap { min-width:0; }
.topbar {
  height:72px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 30px;gap:16px;
}
.topbar-title { font-weight:800;letter-spacing:-.3px;font-size:17px; }
.topbar-sub { color:var(--muted);font-size:11px;margin-top:3px; }
.topbar-right { display:flex;align-items:center;gap:10px; }
.today-chip {
  border:1px solid var(--line);background:#f9fbfa;border-radius:20px;
  padding:8px 12px;color:#536764;font-size:12px;font-weight:650;
}
.content { max-width:1500px;margin:0 auto;padding:26px 30px 44px; }
.page-head {
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:18px;margin-bottom:21px;
}
.page-head h1 { margin:0;font-size:24px;letter-spacing:-.7px; }
.page-head p { margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55; }
.page-actions { display:flex;gap:8px;flex-wrap:wrap; }
.card {
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:19px;margin-bottom:16px;min-width:0;
}
.card-head {
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:14px;margin-bottom:15px;
}
.card-head h2,.card h2 { margin:0;font-size:15px;letter-spacing:-.2px; }
.card-head p { margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5; }
.kpi-grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:16px; }
.kpi {
  background:#fff;border:1px solid var(--line);border-radius:13px;
  box-shadow:var(--shadow);padding:16px;min-width:0;
}
.kpi-top { display:flex;align-items:center;justify-content:space-between;gap:8px; }
.kpi-label { color:var(--muted);font-size:11px;font-weight:700; }
.kpi-icon {
  width:30px;height:30px;border-radius:9px;background:var(--green-light);
  display:grid;place-items:center;color:var(--green);font-size:15px;
}
.kpi-value { font-weight:850;font-size:23px;letter-spacing:-.7px;margin-top:10px; }
.kpi-note { color:var(--muted);font-size:11px;margin-top:4px; }
.grid-2 { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px; }
.grid-3 { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px; }
.form-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px; }
.field { display:flex;flex-direction:column;gap:6px;min-width:0; }
.field > span { color:#4e6260;font-weight:700;font-size:11px; }
.field input,.field select,.field textarea {
  width:100%;min-width:0;border:1px solid #dce6e2;background:#fff;color:var(--ink);
  padding:10px 11px;border-radius:8px;outline:none;font-size:13px;
}
.field input:focus,.field select:focus,.field textarea:focus {
  border-color:#53a28e;box-shadow:0 0 0 3px rgba(24,124,104,.10);
}
.field textarea { min-height:75px;resize:vertical; }
.span-all { grid-column:1/-1; }
.form-footer {
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:15px;padding-top:14px;border-top:1px solid #edf1ef;flex-wrap:wrap;
}
.form-note { color:var(--muted);font-size:11px;line-height:1.5; }
.btn {
  border:1px solid transparent;border-radius:8px;padding:9px 13px;
  font-size:12px;font-weight:750;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;white-space:nowrap;
}
.btn-primary { background:var(--green);color:#fff; }
.btn-primary:hover { background:var(--green-dark); }
.btn-outline { background:#fff;border-color:#dce6e2;color:#405653; }
.btn-outline:hover { background:#f5f9f7; }
.btn-soft { background:var(--green-light);color:var(--green-dark); }
.btn-danger { background:#fff4f3;border-color:#f0d6d3;color:var(--red); }
.btn-sm { padding:7px 10px;font-size:11px; }
.segmented { display:inline-flex;padding:3px;background:#f0f5f3;border-radius:9px;gap:2px;flex-wrap:wrap; }
.segmented button {
  border:0;background:transparent;color:#637572;border-radius:7px;
  padding:7px 10px;font-size:11px;font-weight:750;
}
.segmented button.active { background:#fff;color:var(--green-dark);box-shadow:0 1px 4px rgba(30,60,50,.1); }
.table-wrap { width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px; }
table { width:100%;border-collapse:collapse;min-width:700px;background:#fff; }
th {
  background:#f7faf8;color:#657774;font-size:10px;text-align:left;
  text-transform:uppercase;letter-spacing:.55px;font-weight:800;
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td { font-size:12px;padding:11px 12px;border-bottom:1px solid #edf1ef;vertical-align:middle; }
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover { background:#fbfdfc; }
.td-main { font-weight:750;color:#263c39; }
.td-sub { color:var(--muted);font-size:10px;margin-top:3px; }
.num-cell { font-variant-numeric:tabular-nums;white-space:nowrap; }
.badge {
  display:inline-flex;align-items:center;border-radius:20px;padding:4px 8px;
  font-size:10px;font-weight:800;background:#eff4f2;color:#50635f;white-space:nowrap;
}
.badge-green { background:#e8f5ef;color:#18745e; }
.badge-amber { background:#fff5e5;color:#9b650e; }
.badge-red { background:#fff0ef;color:#ad4340; }
.empty-state {
  padding:27px 15px;text-align:center;color:var(--muted);font-size:12px;
}
.empty-icon { font-size:22px;margin-bottom:6px; }
.notice {
  padding:11px 13px;border:1px solid #dcebe5;background:#f5fbf8;
  color:#536b64;border-radius:9px;font-size:11px;line-height:1.55;margin-bottom:14px;
}
.tabs-row { display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap; }
.period-summary { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0; }
.summary-chip { background:#f8fbf9;border:1px solid var(--line);border-radius:9px;padding:11px 12px; }
.summary-chip span { display:block;color:var(--muted);font-size:10px;font-weight:700; }
.summary-chip strong { display:block;margin-top:5px;font-size:16px;letter-spacing:-.3px; }
.week-grid { display:grid;grid-template-columns:repeat(7,minmax(95px,1fr));gap:8px;margin:14px 0;overflow:auto; }
.week-day {
  border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;
  padding:11px;min-height:96px;color:var(--ink);
}
.week-day.selected { border-color:#53a28e;box-shadow:0 0 0 2px rgba(24,124,104,.1); }
.week-day strong { display:block;font-size:11px; }
.week-day span { display:block;color:var(--muted);font-size:10px;margin-top:7px; }
.month-grid { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:14px 0; }
.month-weekday { color:var(--muted);font-size:10px;font-weight:800;text-align:center;padding:5px; }
.month-cell {
  min-height:70px;border:1px solid var(--line);border-radius:8px;
  padding:7px;background:#fff;text-align:left;color:var(--ink);
}
.month-cell.outside { background:#f8faf9;color:#9ba9a5; }
.month-cell.selected { border-color:#53a28e;box-shadow:0 0 0 2px rgba(24,124,104,.1); }
.month-cell .day-num { font-size:11px;font-weight:800; }
.month-cell small { display:block;color:var(--muted);font-size:9px;margin-top:5px;line-height:1.4; }
.role-pills { display:flex;flex-wrap:wrap;gap:7px;margin-top:12px; }
.role-pill { background:#f0f5f3;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:700;color:#536560; }
details.card { padding:0;overflow:hidden; }
details.card summary { cursor:pointer;list-style:none;padding:16px 19px;font-weight:800;font-size:13px; }
details.card summary::-webkit-details-marker { display:none; }
details.card summary:after { content:"＋";float:right;color:var(--green); }
details.card[open] summary:after { content:"−"; }
.details-body { padding:0 19px 18px; }
.rate-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px; }
.rate-grid .field { background:#f9fbfa;border:1px solid var(--line);border-radius:9px;padding:10px; }
.rate-grid .field input { padding:8px; }
.attendance-estimate {
  background:#f5fbf8;border:1px solid #dcebe5;border-radius:9px;
  padding:10px 12px;font-size:11px;color:#536b64;
}
.attendance-estimate strong { color:var(--green-dark);font-size:13px;margin-left:5px; }
.sort-row { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.sort-label { color:var(--muted);font-size:11px;font-weight:800; }
.result-box {
  border:1px solid #d8e9e1;background:#f5fbf8;border-radius:12px;padding:16px;
}
.result-box h3 { margin:0 0 11px;font-size:13px; }
.result-main { font-size:24px;font-weight:850;letter-spacing:-.6px;color:var(--green-dark); }
.result-caption { color:var(--muted);font-size:11px;margin-top:4px; }
.result-list { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px; }
.result-item { background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px; }
.result-item span { display:block;color:var(--muted);font-size:10px; }
.result-item strong { display:block;margin-top:4px;font-size:13px; }
.footer-note { color:var(--muted);font-size:10px;line-height:1.5;margin:10px 2px; }
.toast {
  position:fixed;right:22px;bottom:22px;z-index:10;background:#153d35;color:#fff;
  padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.18);
  font-size:12px;font-weight:700;max-width:360px;
}
.directory-list { display:flex;flex-wrap:wrap;gap:7px;margin-top:11px; }
.directory-item { padding:6px 9px;border-radius:20px;background:#f1f6f4;color:#52645f;font-size:10px;font-weight:700; }
.quick-links { display:flex;gap:8px;flex-wrap:wrap; }
@media (max-width:1100px) {
  .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .form-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .rate-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:800px) {
  .app-shell { grid-template-columns:1fr; }
  .sidebar { padding:12px 12px 8px;gap:11px; }
  .brand { padding:0 4px; }
  .sidebar .nav-label,.sidebar-foot { display:none; }
  .nav-list { flex-direction:row;overflow-x:auto;padding-bottom:3px; }
  .nav-link { width:auto;white-space:nowrap;padding:9px 11px; }
  .topbar { height:64px;padding:0 16px; }
  .content { padding:20px 16px 35px; }
}
@media (max-width:600px) {
  .page-head { flex-direction:column; }
  .page-head h1 { font-size:21px; }
  .grid-2,.grid-3 { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  .field.span-all { grid-column:auto; }
  .kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr));gap:9px; }
  .kpi { padding:13px; }
  .kpi-value { font-size:20px; }
  .period-summary { grid-template-columns:1fr; }
  .rate-grid { grid-template-columns:1fr; }
  .topbar-right .today-chip { display:none; }
  .month-cell { min-height:55px;padding:5px; }
  .month-cell small { font-size:8px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STORAGE_KEY = "buildledger-india-v1";
const DEFAULTS = {
  sites: [],
  clients: [],
  vendors: [],
  contractors: [],
  roles: [
    "General Labour", "Mason", "Helper", "Bar Bender", "Carpenter",
    "Electrician", "Site Engineer", "Site Supervisor", "Safety Officer"
  ],
  roleRates: {},
  attendance: [],
  progress: [],
  expenses: [],
  accounts: [],
  stock: [],
  mbook: []
};

function loadDatabase() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved) return JSON.parse(JSON.stringify(DEFAULTS));
    return {
      ...JSON.parse(JSON.stringify(DEFAULTS)),
      ...saved,
      sites: Array.isArray(saved.sites) ? saved.sites : [],
      clients: Array.isArray(saved.clients) ? saved.clients : [],
      vendors: Array.isArray(saved.vendors) ? saved.vendors : [],
      contractors: Array.isArray(saved.contractors) ? saved.contractors : [],
      roles: Array.isArray(saved.roles) ? saved.roles : DEFAULTS.roles.slice(),
      roleRates: saved.roleRates || {},
      attendance: Array.isArray(saved.attendance) ? saved.attendance : [],
      progress: Array.isArray(saved.progress) ? saved.progress : [],
      expenses: Array.isArray(saved.expenses) ? saved.expenses : [],
      accounts: Array.isArray(saved.accounts) ? saved.accounts : [],
      stock: Array.isArray(saved.stock) ? saved.stock : [],
      mbook: Array.isArray(saved.mbook) ? saved.mbook : []
    };
  } catch {
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
}
let db = loadDatabase();

function saveDatabase() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }
  catch (e) { console.warn("Could not save app data", e); }
}
function uid() {
  return (globalThis.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
function num(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : 0;
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parseISO(value) {
  if (!value) return new Date();
  const [y,m,d] = value.split("-").map(Number);
  return new Date(y, m-1, d);
}
function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(d, days) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  r.setDate(r.getDate() + days);
  return r;
}
function mondayOf(d) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dow = r.getDay();
  r.setDate(r.getDate() + (dow === 0 ? -6 : 1-dow));
  return r;
}
function dateLabel(value, options={day:"2-digit",month:"short",year:"numeric"}) {
  if (!value) return "—";
  return new Intl.DateTimeFormat("en-IN", options).format(parseISO(value));
}
function money(value) {
  return new Intl.NumberFormat("en-IN", {
    style:"currency", currency:"INR", maximumFractionDigits:2
  }).format(num(value));
}
function fmt(value, digits=2) {
  return new Intl.NumberFormat("en-IN", {maximumFractionDigits:digits}).format(num(value));
}
function remember(listName, value) {
  const clean = String(value || "").trim();
  if (!clean || !Array.isArray(db[listName])) return;
  if (!db[listName].some(x => x.toLowerCase() === clean.toLowerCase())) db[listName].push(clean);
}
function uniqueValues(values) {
  return [...new Set(values.filter(Boolean).map(v => String(v).trim()))]
    .sort((a,b) => a.localeCompare(b));
}

let activeView = "dashboard";
let attendanceMode = "role";
let attendanceCalendar = "day";
let attendanceDate = todayISO();
let accountTab = "receivable";
let stockSort = "material";
let bookGroup = "project";
let bookFilter = "all";
let calcTool = "concrete";
let civilInputs = {
  concrete:{length:"0",width:"0",depth:"0",mix:"M20"},
  rebar:{diameter:"0",length:"0",bars:"0"},
  brick:{length:"0",height:"0",thickness:"0"}
};
let civilResult = null;
let converterDimension = "length";
let converterFrom = "m";
let converterTo = "ft";
let converterValue = "0";
let converterResult = null;
let rightUnit = "m";
let rightResult = null;
let toastMessage = "";

const app = document.getElementById("app");
const titles = {
  dashboard:"Overview",
  attendance:"Labor & staff attendance",
  progress:"Daily progress & out-turn",
  expenses:"Site expenditure",
  accounts:"Accounts",
  stock:"Stock register",
  mbook:"M-Book",
  calculator:"Civil calculator",
  converter:"Unit converter",
  rightangle:"Right-angle marking",
  settings:"Directories & settings"
};
const navItems = [
  ["dashboard","▦","Overview"],
  ["attendance","◷","Attendance"],
  ["progress","↗","Daily progress"],
  ["expenses","₹","Expenditure"],
  ["accounts","⇄","Payables & receivables"],
  ["stock","▤","Stock register"],
  ["mbook","▧","M-Book"],
  ["calculator","∑","Civil calculator"],
  ["converter","⇄","Unit converter"],
  ["rightangle","∟","Right-angle marking"],
  ["settings","⚙","Directories"]
];

function fieldText(name, label, opts={}) {
  const type = opts.type || "text";
  const value = opts.value === undefined ? "" : String(opts.value);
  const required = opts.required ? "required" : "";
  const list = opts.list ? `list="${esc(opts.list)}"` : "";
  const placeholder = opts.placeholder ? `placeholder="${esc(opts.placeholder)}"` : "";
  const min = opts.min !== undefined ? `min="${esc(opts.min)}"` : "";
  const step = opts.step !== undefined ? `step="${esc(opts.step)}"` : "";
  const id = opts.id ? `id="${esc(opts.id)}"` : "";
  const readonly = opts.readonly ? "readonly" : "";
  const data = opts.data || "";
  const cls = opts.wide ? " span-all" : "";
  return `<label class="field${cls}"><span>${esc(label)}</span>
    <input ${id} type="${esc(type)}" name="${esc(name)}" value="${esc(value)}"
      ${required} ${list} ${placeholder} ${min} ${step} ${readonly} ${data}></label>`;
}
function fieldSelect(name, label, options, selected="", required=false, id="") {
  const opts = options.map(item => typeof item === "string"
    ? {value:item,label:item} : item);
  return `<label class="field"><span>${esc(label)}</span>
    <select ${id ? `id="${esc(id)}"` : ""} name="${esc(name)}" ${required ? "required" : ""}>
      ${opts.map(o => `<option value="${esc(o.value)}" ${String(o.value)===String(selected)?"selected":""}>${esc(o.label)}</option>`).join("")}
    </select></label>`;
}
function siteField(required=true, name="site", label="Site / project") {
  return fieldText(name,label,{list:"siteOptions",required,placeholder:"Enter or choose a site"});
}
function clientField(required=false, name="client", label="Client") {
  return fieldText(name,label,{list:"clientOptions",required,placeholder:"Enter or choose a client"});
}
function contractorField(required=false) {
  return fieldText("contractor","Contractor / subcontractor",{
    list:"contractorOptions",required,placeholder:"Optional for direct labor"
  });
}
function renderDatalists() {
  const list = (id, values) => `<datalist id="${id}">${uniqueValues(values)
    .map(v => `<option value="${esc(v)}"></option>`).join("")}</datalist>`;
  return list("siteOptions",db.sites) +
    list("clientOptions",db.clients) +
    list("vendorOptions",db.vendors) +
    list("contractorOptions",db.contractors);
}
function button(label, action, cls="btn btn-outline", extra="") {

/* Attendance */
function modeName(mode) {
  return mode === "role" ? "By Role" : mode === "contractor" ? "By Contractor / Subcontractor" : "By Name";
}
function roleOptions(optional=false) {
  const list = db.roles.map(r=>({value:r,label:r}));
  if (optional) list.unshift({value:"",label:"Not specified"});
  return list;
}
function rangeAttendance() {
  const selected = parseISO(attendanceDate);
  let start, end;
  if (attendanceCalendar === "day") {
    start = selected; end = selected;
  } else if (attendanceCalendar === "week") {
    start = mondayOf(selected); end = addDays(start,6);
  } else {
    start = new Date(selected.getFullYear(),selected.getMonth(),1);
    end = new Date(selected.getFullYear(),selected.getMonth()+1,0);
  }
  const startISO = toISO(start), endISO = toISO(end);
  return {
    start,startISO,end,endISO,
    rows:db.attendance.filter(r=>r.date>=startISO && r.date<=endISO)
      .sort((a,b)=>(a.date||"").localeCompare(b.date||""))
  };
}
function renderAttendanceRows(rows) {
  if (!rows.length) return emptyState("No attendance entries in this period.");
  return `<div class="table-wrap"><table><thead><tr>
    <th>Date</th><th>Site</th><th>Category</th><th>Entry</th><th>People</th>
    <th>Shifts / person</th><th>Labor-shifts</th><th>Rate / shift</th><th>Billing</th>
    </tr></thead><tbody>${rows.map(r=>{
      let entry = r.mode==="role" ? (r.role||"—")
        : r.mode==="contractor" ? `${r.contractor||"Contractor"}${r.role?" · "+r.role:""}`
        : (r.name||"—");
      if (r.mode==="role" && r.contractor) entry += ` <span class="td-sub">· ${esc(r.contractor)}</span>`;
      return `<tr><td>${dateLabel(r.date)}</td><td class="td-main">${esc(r.site||"—")}</td>
        <td><span class="badge">${esc(modeName(r.mode))}</span></td><td class="td-main">${entry}</td>
        <td class="num-cell">${fmt(r.workers,0)}</td><td class="num-cell">${fmt(r.shifts,2)}</td>
        <td class="num-cell">${fmt(num(r.workers)*num(r.shifts),2)}</td>
        <td class="num-cell">${money(r.rate)}</td><td class="num-cell">${money(r.amount)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}
function renderAttendanceCalendar() {
  const selected = parseISO(attendanceDate);
  if (attendanceCalendar === "day") {
    return `<div class="notice"><strong>Selected day:</strong> ${dateLabel(attendanceDate)}. Choose a different date above to review or enter another day.</div>`;
  }
  if (attendanceCalendar === "week") {
    const start = mondayOf(selected);
    const dayNames = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    return `<div class="week-grid">${dayNames.map((name,i)=>{
      const d = addDays(start,i), iso = toISO(d);
      const rows = db.attendance.filter(r=>r.date===iso);
      const headcount = rows.reduce((s,r)=>s+num(r.workers),0);
      const bill = rows.reduce((s,r)=>s+num(r.amount),0);
      return `<button class="week-day ${iso===attendanceDate?"selected":""}" data-att-date="${iso}">
        <strong>${name} · ${d.getDate()}</strong><span>${fmt(headcount,0)} people</span>
        <span>${money(bill)}</span></button>`;
    }).join("")}</div>`;
  }
  const first = new Date(selected.getFullYear(),selected.getMonth(),1);
  const gridStart = mondayOf(first);
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const cells = Array.from({length:42},(_,i)=>addDays(gridStart,i));
  return `<div class="month-grid">${days.map(d=>`<div class="month-weekday">${d}</div>`).join("")}
    ${cells.map(d=>{
      const iso=toISO(d), rows=db.attendance.filter(r=>r.date===iso);
      const workers=rows.reduce((s,r)=>s+num(r.workers),0);
      const bill=rows.reduce((s,r)=>s+num(r.amount),0);
      const outside=d.getMonth()!==selected.getMonth();
      return `<button class="month-cell ${outside?"outside":""} ${iso===attendanceDate?"selected":""}" data-att-date="${iso}">
        <span class="day-num">${d.getDate()}</span>
        <small>${workers ? `${fmt(workers,0)} people · ${money(bill)}` : "—"}</small>
      </button>`;
    }).join("")}</div>`;
}

function accountBalance(a) { return Math.max(0,num(a.amount)-num(a.paid)); }
function renderAccounts() {
  const rows = db.accounts.filter(a=>a.type===accountTab).slice().sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));
  const all = db.accounts.filter(a=>a.type===accountTab);
  const total = all.reduce((s,a)=>s+num(a.amount),0);
  const paid = all.reduce((s,a)=>s+num(a.paid),0);
  const outstanding = all.reduce((s,a)=>s+accountBalance(a),0);
  const partyLabel = accountTab==="receivable" ? "Client" : "Vendor / subcontractor";
  const partyList = accountTab==="receivable" ? "clientOptions" : "vendorOptions";
  const tabs = `<div class="segmented">
    <button class="${accountTab==="receivable"?"active":""}" data-account-tab="receivable">Accounts receivable</button>
    <button class="${accountTab==="payable"?"active":""}" data-account-tab="payable">Accounts payable</button>
  </div>`;
  return `${header("Accounts payable & receivable","Track invoices, client collections, vendor bills and outstanding balances.",tabs)}
    <div class="kpi-grid">

    {value:"m",label:"Metre (m)",factor:1},{value:"km",label:"Kilometre (km)",factor:1000},

  ],

    {value:"m2",label:"Square metre (m²)",factor:1},
    {value:"ft2",label:"Square foot (ft²)",factor:.09290304},
    {value:"yd2",label:"Square yard (yd²)",factor:.83612736},
    {value:"ha",label:"Hectare (ha)",factor:10000},
    {value:"acre",label:"Acre",factor:4046.8564224}
  ],
  volume:[
    {value:"cm3",label:"Cubic centimetre (cm³)",factor:.000001},
    {value:"L",label:"Litre (L)",factor:.001},
    {value:"m3",label:"Cubic metre (m³)",factor:1},
    {value:"ft3",label:"Cubic foot (ft³)",factor:.0283168466},
    {value:"yd3",label:"Cubic yard (yd³)",factor:.764554858},
    {value:"usgal",label:"US gallon",factor:.0037854118}
  ],
  mass:[
    {value:"g",label:"Gram (g)",factor:.001},{value:"kg",label:"Kilogram (kg)",factor:1},
    {value:"tonne",label:"Metric tonne",factor:1000},{value:"lb",label:"Pound (lb)",factor:.45359237}
  ],
  pressure:[
    {value:"Pa",label:"Pascal (Pa)",factor:1},{value:"kPa",label:"Kilopascal (kPa)",factor:1000},
    {value:"MPa",label:"Megapascal (MPa)",factor:1000000},{value:"bar",label:"Bar",factor:100000},
    {value:"psi",label:"Pound per square inch (psi)",factor:6894.757},
    {value:"kgcm2",label:"kgf/cm²",factor:98066.5}
  ],
  temperature:[
    {value:"C",label:"Celsius (°C)"},{value:"F",label:"Fahrenheit (°F)"},{value:"K",label:"Kelvin (K)"}
  ]
};
function convertUnits(value,from,to,dimension) {
  if (dimension==="temperature") {
    let c=value;
    if (from==="F") c=(value-32)*5/9;
    if (from==="K") c=value-273.15;
    if (to==="F") return c*9/5+32;
    if (to==="K") return c+273.15;
    return c;
  }
  const units=UNIT_GROUPS[dimension];
  const a=units.find(u=>u.value===from), b=units.find(u=>u.value===to);
  return a && b ? value*a.factor/b.factor : 0;
}
function renderConverter() {
  const dimensions=Object.keys(UNIT_GROUPS).map(k=>({value:k,label:k[0].toUpperCase()+k.slice(1)}));
  const units=UNIT_GROUPS[converterDimension];
  const from=units.some(u=>u.value===converterFrom)?converterFrom:units[0].value;
  const to=units.some(u=>u.value===converterTo)?converterTo:units[Math.min(1,units.length-1)].value;
  const result=converterResult ? `<div class="result-box"><h3>Converted value</h3>
    <div class="result-main">${fmt(converterResult.value,8)} ${esc(converterResult.toLabel)}</div>
    <div class="result-caption">${fmt(converterResult.input,8)} ${esc(converterResult.fromLabel)} = ${fmt(converterResult.value,8)} ${esc(converterResult.toLabel)}</div>
  </div>` : `<div class="empty-state">Enter a value and choose the units to convert.</div>`;
  return `${header("Unit converter","Convert common civil and construction quantities. This tool is separate from the civil calculator.")}
    <div class="grid-2">
      <section class="card"><div class="card-head"><div><h2>Convert units</h2><p>Length, area, volume, mass, pressure and temperature.</p></div></div>

          ${fieldText("value","Value",{type:"number",value:converterValue,min:"0",step:"any",required:true})}
          ${fieldSelect("from","From",units.map(u=>({value:u.value,label:u.label})),from,true,"converterFrom")}
          ${fieldSelect("to","To",units.map(u=>({value:u.value,label:u.label})),to,true,"converterTo")}
        </div><div class="form-footer"><span class="form-note">All numeric inputs start at 0.</span>
          <button class="btn btn-primary" type="submit">Convert</button></div></form>
      </section>
      <section class="card"><div class="card-head"><div><h2>Result</h2><p>Conversion output.</p></div></div>${result}</section>
    </div>`;
}

    <div class="notice"><strong>On-site method:</strong> establish a baseline, mark the two legs, and adjust the second line until its diagonal matches the calculated value. Use a longer 3–4–5 multiple for better accuracy on larger layouts.</div>
    <div class="grid-2">
      <section class="card"><div class="card-head"><div><h2>Calculate a diagonal</h2><p>Use the Pythagorean theorem to check a proposed right-angle set-out.</p></div></div>
        <form id="rightForm"><div class="form-grid">
          ${fieldText("a","Baseline leg",{type:"number",value:"0",min:"0",step:"0.001"})}
          ${fieldText("b","Second leg",{type:"number",value:"0",min:"0",step:"0.001"})}
          ${fieldText("measured","Measured diagonal (optional)",{type:"number",value:"0",min:"0",step:"0.001"})}
          ${fieldSelect("unit","Unit",units,rightUnit,true)}
        </div><div class="form-footer"><span class="form-note">If measured, diagonal is compared with the expected value.</span>
          <button class="btn btn-primary" type="submit">Calculate diagonal</button></div></form>
      </section>
      <section class="card"><div class="card-head"><div><h2>Generate 3–4–5 measurements</h2><p>Choose the scale multiplier to suit the site.</p></div></div>
        <form id="right345Form"><div class="form-grid">
          ${fieldText("scale","Scale length",{type:"number",value:"0",min:"0",step:"0.001"})}
          ${fieldSelect("unit","Unit",units,rightUnit,true)}
        </div><div class="form-footer"><span class="form-note">For a 1 m scale, mark 3 m, 4 m and 5 m.</span>
          <button class="btn btn-primary" type="submit">Generate set-out</button></div></form>
      </section>
    </div>
    <section class="card"><div class="card-head"><div><h2>Site marking result</h2><p>Use a tape measure and recheck the baseline before fixing the layout.</p></div></div>${result}</section>`;
}

/* Directories */

  const lists=[
    ["sites","Sites / projects"],["clients","Clients"],["vendors","Vendors"],["contractors","Contractors / subcontractors"]
  ];
  return `${header("Directories & settings","Maintain reusable site, client, vendor and contractor names. Names entered in forms are also added automatically.")}
    <section class="card"><div class="card-head"><div><h2>Add a directory entry</h2><p>Directory names are available as suggestions in relevant forms.</p></div></div>
      <form id="directoryForm"><div class="form-grid">
        ${fieldSelect("kind","Directory",lists.map(([v,l])=>({value:v,label:l})),"sites",true)}
        ${fieldText("value","Name",{required:true,placeholder:"Enter a site, client, vendor or contractor"})}
      </div><div class="form-footer"><span class="form-note">Use distinct names for different projects and business partners.</span>
        <button class="btn btn-primary" type="submit">＋ Add directory entry</button></div></form>
    </section>
    <div class="grid-2">${lists.map(([key,label])=>`<section class="card">
      <div class="card-head"><div><h2>${esc(label)}</h2><p>${fmt(db[key].length,0)} saved</p></div></div>
      ${db[key].length?`<div class="directory-list">${uniqueValues(db[key]).map(v=>`<span class="directory-item">${esc(v)}</span>`).join("")}</div>`:emptyState(`No ${label.toLowerCase()} added yet.`)}
    </section>`).join("")}</div>
    <div class="notice"><strong>Local storage:</strong> application data stays in this browser profile. Use the Backup button to download a JSON copy before changing devices or clearing browser data.</div>`;
}

/* Saturday labor billings */
function createSaturdayBillings() {
  const start=mondayOf(parseISO(attendanceDate));
  const startISO=toISO(start);
  const saturday=toISO(addDays(start,5));
  const end=toISO(addDays(start,6));
  const weekRows=db.attendance.filter(r=>r.date>=startISO && r.date<=end);
  const groups=new Map();
  weekRows.forEach(r=>{
    const amount=num(r.amount);
    if (amount<=0) return;
    const site=(r.site||"Unassigned").trim();
    const party=(r.contractor||"Direct Labour").trim();
    const key=site.toLowerCase()+"|"+party.toLowerCase();
    if (!groups.has(key)) groups.set(key,{site,party,amount:0,roles:new Set()});
    const g=groups.get(key);g.amount+=amount;
    if (r.role) g.roles.add(r.role);
  });
  let created=0, skipped=0;
  groups.forEach((g,key)=>{
    const sourceKey=`labor:${startISO}:${key}`;
    if (db.accounts.some(a=>a.sourceKey===sourceKey)) { skipped++; return; }
    db.accounts.push({
      id:uid(),type:"payable",party:g.party,site:g.site,
      reference:`LAB-${saturday.replaceAll("-","")}-${created+1}`,
      date:saturday,dueDate:saturday,amount:g.amount,paid:0,
      description:`Weekly labor billing (${dateLabel(startISO)}–${dateLabel(end)}). Roles: ${[...g.roles].join(", ")||"Not specified"}`,
      sourceKey
    });
    remember("vendors",g.party);
    remember("sites",g.site);
    created++;
  });
  saveDatabase();
  toast(created ? `${created} Saturday labor payable${created===1?"":"s"} created${skipped?`; ${skipped} already existed`:""}.`
    : skipped ? "Saturday labor billings for this week already exist."
    : "No positive labor billing found. Enter a rate per shift and attendance first.");
}

/* Event handling */
function toast(message) {
  toastMessage=message;
  render();
  setTimeout(()=>{ if(toastMessage===message){toastMessage="";render();} },3000);
}
function downloadBackup() {
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`buildledger-backup-${todayISO()}.json`;
  document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
}
function handleSubmit(event) {
  const form=event.target.closest("form");
  if (!form) return;
  const id=form.id;
  if (!id) return;
  event.preventDefault();
  const fd=new FormData(form);

  if (id==="attendanceForm") {
    const mode=attendanceMode;
    const role=String(fd.get("role")||"");
    const workerCount=mode==="name" ? 1 : num(fd.get("workers"));
    const shifts=num(fd.get("shifts")), rate=num(fd.get("rate"));
    const site=String(fd.get("site")||"").trim();
    const contractor=String(fd.get("contractor")||"").trim();
    const row={
      id:uid(),date:String(fd.get("date")),site,mode,
      role,contractor,
      name:mode==="name"?String(fd.get("name")||"").trim():"",
      workers:workerCount,shifts,rate,amount:workerCount*shifts*rate
    };
    db.attendance.push(row);remember("sites",site);remember("contractors",contractor);
    saveDatabase();toast("Attendance entry saved.");return;
  }
  if (id==="roleForm") {
    const role=String(fd.get("roleName")||"").trim();
    if (!role) return;
    if (db.roles.some(r=>r.toLowerCase()===role.toLowerCase())) {
      toast("That role already exists.");return;
    }
    db.roles.push(role);db.roleRates[role]=num(fd.get("standardRate"));
    saveDatabase();toast(`Role “${role}” added.`);return;
  }
  if (id==="ratesForm") {
    db.roles.forEach((r,i)=>db.roleRates[r]=num(fd.get(`rate_${i}`)));
    saveDatabase();toast("Standard role rates saved.");return;
  }
  if (id==="progressForm") {
    const site=String(fd.get("site")||"").trim(), client=String(fd.get("client")||"").trim();
    db.progress.push({
      id:uid(),date:String(fd.get("date")),site,client,
      activity:String(fd.get("activity")||"").trim(),role:String(fd.get("role")||""),
      unit:String(fd.get("unit")||"m³"),quantity:num(fd.get("quantity")),
      target:num(fd.get("target")),workers:num(fd.get("workers")),
      notes:String(fd.get("notes")||"").trim()
    });
    remember("sites",site);remember("clients",client);
    saveDatabase();toast("Daily progress report saved.");return;
  }
  if (id==="expenseForm") {
    const site=String(fd.get("site")||"").trim(),client=String(fd.get("client")||"").trim();
    const vendor=String(fd.get("vendor")||"").trim();
    db.expenses.push({
      id:uid(),date:String(fd.get("date")),site,client,vendor,
      category:String(fd.get("category")),amount:num(fd.get("amount")),
      description:String(fd.get("description")||"").trim()
    });
    remember("sites",site);remember("clients",client);remember("vendors",vendor);
    saveDatabase();toast("Expense saved.");return;
  }
  if (id==="accountForm") {
    const party=String(fd.get("party")||"").trim(),site=String(fd.get("site")||"").trim();
    db.accounts.push({
      id:uid(),type:accountTab,party,site,reference:String(fd.get("reference")||"").trim(),
      date:String(fd.get("date")),dueDate:String(fd.get("dueDate")),
      amount:num(fd.get("amount")),paid:0,description:String(fd.get("description")||"").trim()
    });
    remember(accountTab==="receivable"?"clients":"vendors",party);remember("sites",site);
    saveDatabase();toast(accountTab==="receivable"?"Receivable added.":"Payable added.");return;
  }
  if (id==="stockForm") {
    const site=String(fd.get("site")||"").trim(),item=String(fd.get("item")||"").trim();
    const category=String(fd.get("category")),unit=String(fd.get("unit")||"Nos").trim();
    const opening=num(fd.get("opening")),received=num(fd.get("received")),issued=num(fd.get("issued"));
    const existing=db.stock.find(r=>r.site.toLowerCase()===site.toLowerCase()
      && r.item.toLowerCase()===item.toLowerCase()
      && r.category===category && r.unit.toLowerCase()===unit.toLowerCase());
    if (existing) {
      existing.opening=num(existing.opening)+opening;
      existing.received=num(existing.received)+received;
      existing.issued=num(existing.issued)+issued;
      existing.minimum=num(fd.get("minimum"));
      if (num(fd.get("unitCost"))>0) existing.unitCost=num(fd.get("unitCost"));
      existing.date=String(fd.get("date"));
    } else {
      db.stock.push({
        id:uid(),date:String(fd.get("date")),site,category,item,unit,
        opening,received,issued,minimum:num(fd.get("minimum")),unitCost:num(fd.get("unitCost"))
      });
    }
    remember("sites",site);saveDatabase();toast("Stock register updated.");return;
  }
  if (id==="mbookForm") {
    const site=String(fd.get("site")||"").trim(),client=String(fd.get("client")||"").trim();
    const nos=num(fd.get("nos")),length=num(fd.get("length")),breadth=num(fd.get("breadth")),depth=num(fd.get("depth"));
    db.mbook.push({
      id:uid(),date:String(fd.get("date")),site,client,
      bookNo:String(fd.get("bookNo")||"").trim(),item:String(fd.get("item")||"").trim(),
      unit:String(fd.get("unit")||"m³").trim(),nos,length,breadth,depth,
      quantity:nos*length*breadth*depth
    });
    remember("sites",site);remember("clients",client);saveDatabase();toast("M-Book measurement saved.");return;
  }
  if (id==="civilForm") {
    if (calcTool==="concrete") {
      const x={length:String(fd.get("length")),width:String(fd.get("width")),depth:String(fd.get("depth")),mix:String(fd.get("mix"))};
      civilInputs.concrete=x;
      const wet=num(x.length)*num(x.width)*num(x.depth);
      const dry=wet*1.54,mix=MIXES[x.mix]||MIXES.M20;
      const total=mix.cement+mix.sand+mix.aggregate;
      const cementVolume=dry*mix.cement/total;
      const bags=cementVolume/.0347;
      civilResult={type:"concrete",mix:x.mix,wet,dry,bags,
        sand:dry*mix.sand/total,aggregate:dry*mix.aggregate/total};
    } else if (calcTool==="rebar") {
      const x={diameter:String(fd.get("diameter")),length:String(fd.get("length")),bars:String(fd.get("bars"))};
      civilInputs.rebar=x;
      const diameter=num(x.diameter),length=num(x.length),bars=num(x.bars),perM=diameter*diameter/162;
      civilResult={type:"rebar",diameter,length,bars,perM,total:perM*length*bars};
    } else {
      const x={length:String(fd.get("length")),height:String(fd.get("height")),thickness:String(fd.get("thickness"))};
      civilInputs.brick=x;
      const volume=num(x.length)*num(x.height)*num(x.thickness);
      civilResult={type:"brick",volume,bricks:Math.ceil(volume*500)};
    }
    render();return;
  }
  if (id==="converterForm") {
    converterDimension=String(fd.get("dimension"));
    converterFrom=String(fd.get("from"));converterTo=String(fd.get("to"));
    converterValue=String(fd.get("value"));
    const units=UNIT_GROUPS[converterDimension];
    const fromLabel=(units.find(u=>u.value===converterFrom)||{}).label||converterFrom;
    const toLabel=(units.find(u=>u.value===converterTo)||{}).label||converterTo;
    converterResult={
      input:num(converterValue),value:convertUnits(num(converterValue),converterFrom,converterTo,converterDimension),
      fromLabel,toLabel
    };
    render();return;
  }
  if (id==="rightForm") {
    const a=num(fd.get("a")),b=num(fd.get("b")),measured=num(fd.get("measured"));
    rightUnit=String(fd.get("unit"));
    const expected=Math.sqrt(a*a+b*b);
    let status="Enter a measured diagonal to compare.";
    if (measured>0) {
      const diff=measured-expected,tolerance=Math.max(.01,expected*.005);
      status=Math.abs(diff)<=tolerance ? "Within approximate 0.5% / 10 mm tolerance"
        : `${diff>0?"Longer":"Shorter"} than expected by ${fmt(Math.abs(diff),3)} ${rightUnit}`;
    }
    rightResult={type:"diagonal",a,b,measured,expected,unit:rightUnit,status};
    render();return;
  }
  if (id==="right345Form") {
    const scale=num(fd.get("scale"));rightUnit=String(fd.get("unit"));
    rightResult={type:"345",scale,a:3*scale,b:4*scale,c:5*scale,unit:rightUnit};
    render();return;
  }
  if (id==="directoryForm") {
    const kind=String(fd.get("kind")),value=String(fd.get("value")||"").trim();
    if (Array.isArray(db[kind])) remember(kind,value);
    saveDatabase();toast("Directory entry saved.");return;
  }
}
app.addEventListener("submit",handleSubmit);

app.addEventListener("click",event=>{
  const view=event.target.closest("[data-view]");
  if(view) { activeView=view.dataset.view;render();return; }
  const attMode=event.target.closest("[data-att-mode]");
  if(attMode) { attendanceMode=attMode.dataset.attMode;render();return; }
  const calendar=event.target.closest("[data-calendar]");
  if(calendar) { attendanceCalendar=calendar.dataset.calendar;render();return; }
  const attDate=event.target.closest("[data-att-date]");
  if(attDate) { attendanceDate=attDate.dataset.attDate;render();return; }
  const account=event.target.closest("[data-account-tab]");
  if(account) { accountTab=account.dataset.accountTab;render();return; }
  const sort=event.target.closest("[data-stock-sort]");
  if(sort) { stockSort=sort.dataset.stockSort;render();return; }
  const group=event.target.closest("[data-book-group]");
  if(group) { bookGroup=group.dataset.bookGroup;bookFilter="all";render();return; }
  const calc=event.target.closest("[data-calc-tool]");
  if(calc) { calcTool=calc.dataset.calcTool;civilResult=null;render();return; }
  const action=event.target.closest("[data-action]");
  if(!action) return;
  if(action.dataset.action==="backup") { downloadBackup();return; }
  if(action.dataset.action==="create-billings") { createSaturdayBillings();return; }
  if(action.dataset.action==="settle-account") {
    const a=db.accounts.find(x=>x.id===action.dataset.id);
    if(!a) return;
    const balance=accountBalance(a);
    const input=prompt(`Enter settlement amount (maximum ${money(balance)}):`,balance.toFixed(2));
    if(input===null) return;
    const amount=num(input);
    if(amount<=0) { toast("Enter a settlement amount greater than 0.");return; }
    a.paid=Math.min(num(a.amount),num(a.paid)+amount);
    saveDatabase();toast("Settlement recorded.");return;
  }
});

app.addEventListener("change",event=>{
  const el=event.target;
  if(el.id==="attendanceDate") { attendanceDate=el.value||todayISO();render();return; }
  if(el.id==="attRole") {
    const rate=document.getElementById("attRate");
    if(rate) rate.value=db.roleRates[el.value]||0;
    return;
  }
  if(el.id==="converterDimension") {
    converterDimension=el.value;
    const units=UNIT_GROUPS[converterDimension];
    converterFrom=units[0].value;
    converterTo=units[Math.min(1,units.length-1)].value;
    converterResult=null;
    render();return;
  }
  if(el.id==="converterFrom") { converterFrom=el.value;return; }
  if(el.id==="converterTo") { converterTo=el.value;return; }
  if(el.id==="bookFilter") { bookFilter=el.value;render();return; }
});
app.addEventListener("input",event=>{
  if (!event.target.matches("[data-att-live]")) return;
  const form=document.getElementById("attendanceForm");
  if (!form) return;
  const workers=attendanceMode==="name"?1:num(form.elements.workers?.value);
  const shifts=num(form.elements.shifts?.value);
  const rate=num(form.elements.rate?.value);
  const output=document.getElementById("attendanceEstimate");
  if(output) output.textContent=money(workers*shifts*rate);
});

render();
</script>
